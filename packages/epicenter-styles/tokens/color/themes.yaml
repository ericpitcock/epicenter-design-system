# Interface
interface-bg:
  dark: hsl(var(--gray-430))
  light: hsl(var(--gray-50))
interface-bg--accent:
  dark: hsl(var(--gray-420))
  light: hsl(var(--gray-40))
interface-surface:
  dark: hsl(var(--gray-440))
  light: hsl(var(--gray-30))
interface-surface--accent:
  dark: hsl(var(--gray-420))
  light: hsl(var(--gray-50))
interface-surface--inverse:
  dark: hsl(var(--gray-30))
  light: hsl(var(--gray-440))
interface-foreground:
  dark: hsl(var(--gray-430))
  light: hsl(var(--gray-20))
interface-foreground--accent:
  dark: hsl(var(--gray-420))
  light: hsl(var(--gray-10))
interface-overlay:
  dark: hsl(var(--gray-390))
  light: hsl(var(--gray-10))
interface-overlay--accent:
  dark: hsl(var(--gray-380))
  light: hsl(var(--gray-0))

# Borders
border-color:
  dark: hsl(var(--gray-380))
  light: hsl(var(--gray-100))
# TODO: in the light theme this resolves to --border-color, so it is not actually
# lighter — the name only holds in dark. Left as-is deliberately: changing it
# shifts every component that uses it. Revisit as a design decision, not a fix.
border-color--lighter:
  dark: hsl(var(--gray-340))
  light: var(--border-color)
border-color--disabled:
  dark: hsl(var(--gray-400))
  light: hsl(var(--gray-70))

# Overlay
overlay-color:
  dark: rgba(36, 36, 36, 0.85)
  light: rgba(255, 255, 255, 0.85)

# Shadow
box-shadow-color:
  dark: rgba(0, 0, 0, 0.3)
  light: rgba(0, 0, 0, 0.1)
drop-shadow:
  dark: 0 5px 8px rgba(0, 0, 0, 0.2)
  light: 0 5px 8px rgba(0, 0, 0, 0.05)
drop-shadow--large:
  dark: 0 2px 20px rgba(0, 0, 0, 0.5)
  light: 0 2px 20px rgba(0, 0, 0, 0.15)
drop-shadow--large--north:
  dark: 0 -10px 10px rgba(0, 0, 0, 0.25)
  light: 0 -10px 10px rgba(0, 0, 0, 0.15)

# Text
text-color:
  dark: hsl(var(--gray-150))
  light: hsl(var(--gray-410))
text-color--disabled:
  dark: hsl(var(--gray-300))
  light: hsl(var(--gray-170))
text-color--subtle:
  dark: hsl(var(--gray-220))
  light: hsl(var(--gray-300))
text-color--loud:
  dark: hsl(var(--gray-50))
  light: hsl(var(--gray-500))
text-color--inverse:
  dark: hsl(var(--gray-410))
  light: hsl(var(--gray-150))

# Text Color Variants
text-color--primary:
  dark: var(--primary-color-200)
  light: var(--primary-color-700)
text-color--link:
  dark: hsl(var(--sky-300))
  light: hsl(var(--sky-600))
text-color--danger:
  dark: hsl(var(--red-400))
  light: hsl(var(--red-600))
text-color--warning:
  dark: hsl(var(--amber-500))
  light: hsl(var(--amber-600))
text-color--success:
  dark: hsl(var(--green-600))
  light: hsl(var(--green-700))

# Text Selection
text-selection-bg-color:
  dark: var(--primary-color-base)
  light: var(--primary-color-base)
text-selection-text-color:
  dark: hsl(var(--gray-0))
  light: hsl(var(--gray-0))

# Status
# One family per status, each with a background, a border and a text colour, so
# error/warning/success surfaces are built from a single vocabulary. Replaces the
# --error-color / --error-color--border / --error-color--text trio, which named
# one concept three ways and was never declared by this package.
status-danger-bg-color:
  dark: hsl(var(--red-900))
  light: hsl(var(--red-50))
status-danger-border-color:
  dark: hsl(var(--red-400))
  light: hsl(var(--red-500))
status-danger-text-color:
  dark: hsl(var(--red-400))
  light: hsl(var(--red-600))
status-warning-bg-color:
  dark: hsl(var(--amber-900))
  light: hsl(var(--amber-50))
status-warning-border-color:
  dark: hsl(var(--amber-500))
  light: hsl(var(--amber-500))
status-warning-text-color:
  dark: hsl(var(--amber-500))
  light: hsl(var(--amber-600))
status-success-bg-color:
  dark: hsl(var(--green-900))
  light: hsl(var(--green-50))
status-success-border-color:
  dark: hsl(var(--green-600))
  light: hsl(var(--green-600))
status-success-text-color:
  dark: hsl(var(--green-600))
  light: hsl(var(--green-700))
status-info-bg-color:
  dark: hsl(var(--sky-900))
  light: hsl(var(--sky-50))
status-info-border-color:
  dark: hsl(var(--sky-300))
  light: hsl(var(--sky-500))
status-info-text-color:
  dark: hsl(var(--sky-300))
  light: hsl(var(--sky-600))

# Alert Colors
bg-color--alert-low:
  dark: hsl(var(--gray-300))
  light: hsl(var(--gray-130))
bg-color--alert-medium:
  dark: hsl(var(--yellow-400))
  light: hsl(var(--yellow-400))
bg-color--alert-high:
  dark: hsl(var(--amber-500))
  light: hsl(var(--amber-500))
bg-color--alert-critical:
  dark: hsl(var(--red-500))
  light: hsl(var(--red-500))